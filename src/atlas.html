<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<title>Storage Atlas</title>
<link rel="manifest" href="/atlas/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="192x192" href="/atlas/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/atlas/apple-touch-icon.png">
<style>
[hidden]{display:none!important}
/* Storage Atlas: live view over storage-harvester's /api (tree, events) and VictoriaMetrics history.
   Self-contained: no external scripts, fonts or styles. Layout is an instrument console: a sticky bar with the
   views and the time range, then full-width panels on a fluid grid. Paths and figures are set in mono. */
:root{
  --bg:#f3f5f7; --surface:#fcfcfd; --surface-2:#eef1f4; --surface-3:#e2e6eb;
  --ink:#0f1318; --ink-2:#485160; --muted:#79818e; --hair:#e0e4e9; --axis:#c2c8d0; --ring:rgba(15,19,24,.10);
  --accent:#2a78d6; --accent-wash:rgba(42,120,214,.10); --accent-ink:#1c5cab;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300; --crit-ink:#b42525; --warn-ink:#8a5a00;
  --div-pos:#e34948; --div-pos-deep:#8f1d1d; --div-neg:#2a78d6; --div-neg-deep:#0d366b; --div-mid:#e6e9ed;
  --share:#6250d6; --share-deep:#2e2280;
  --free:#eef1f4; --free-line:#cfd6de; --dark-tile:#5a6270; --other:#a3abb6;
  --act:#eb6834; --act-deep:#7c2d0b; --act-ink:#b4461a; --vm:#8a93a3;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10; --surface:#14171b; --surface-2:#1b1f24; --surface-3:#262b32;
    --ink:#eceff3; --ink-2:#b4bbc6; --muted:#858d99; --hair:#252a31; --axis:#3a404a; --ring:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-wash:rgba(57,135,229,.16); --accent-ink:#86b6ef;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-ink:#0ca30c; --crit-ink:#ef7a7a; --warn-ink:#fab219;
    --div-pos:#d94a4a; --div-pos-deep:#ffaaa3; --div-neg:#3987e5; --div-neg-deep:#b7d3f6; --div-mid:#262b32;
    --share:#9085e9; --share-deep:#d4cffa;
    --free:#1a1e23; --free-line:#2f353e; --dark-tile:#4b525d; --other:#5d6570;
    --act:#e0682a; --act-deep:#ffe0a3; --act-ink:#f0a46c; --vm:#5a6371;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d10; --surface:#14171b; --surface-2:#1b1f24; --surface-3:#262b32;
  --ink:#eceff3; --ink-2:#b4bbc6; --muted:#858d99; --hair:#252a31; --axis:#3a404a; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-wash:rgba(57,135,229,.16); --accent-ink:#86b6ef;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink:#0ca30c; --crit-ink:#ef7a7a; --warn-ink:#fab219;
  --div-pos:#d94a4a; --div-pos-deep:#ffaaa3; --div-neg:#3987e5; --div-neg-deep:#b7d3f6; --div-mid:#262b32;
  --share:#9085e9; --share-deep:#d4cffa;
  --free:#1a1e23; --free-line:#2f353e; --dark-tile:#4b525d; --other:#5d6570;
  --act:#e0682a; --act-deep:#ffe0a3; --act-ink:#f0a46c; --vm:#5a6371;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font-ui);margin:0;min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
html.standalone body::before{background:#0b0d10}  /* black-translucent: the status bar text is white in both themes */
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px)}
.bar-in{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.brand .logo{width:17px;height:17px;flex:none;align-self:center}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:6px 10px;border-radius:5px;color:var(--ink-2);text-decoration:none;white-space:nowrap;font-weight:500}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent-wash);color:var(--accent-ink)}
.tabs a svg{display:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:6px;padding:2px;gap:2px;flex-wrap:nowrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:4px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
.ctl{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.ctl label{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.hosts{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.hosts span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hosts small{color:var(--muted);font-size:11.5px}
.cdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--axis)}
.cdot.open{background:var(--good)}.cdot.wait{background:var(--warn)}.cdot.down{background:var(--crit)}
.cdot.open.pulse{animation:blip .5s ease-out}
@keyframes blip{from{box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 35%,transparent)}to{box-shadow:0 0 0 0 transparent}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.chip.real{background:var(--accent-wash);color:var(--accent-ink)}
.chip.need{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--hair)}
.chip.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-ink)}
.chip.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink)}
.chip svg{width:11px;height:11px}
.btn{border:0;background:var(--surface-2);padding:5px 11px;border-radius:5px;font-size:13px;font-weight:500;box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.on{background:var(--accent);color:#fff;box-shadow:none}
.btn.sm{padding:2px 8px;font-size:12px}

main{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.view-head{display:flex;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;justify-content:space-between}
.view-head h1{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
.view-head p{margin:2px 0 0;color:var(--ink-2);max-width:86ch}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--hair);padding:14px 16px;min-width:0}
.panel h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.005em}
.ph{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;margin-bottom:10px;flex-wrap:wrap}
.ph .sub{color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:13px;padding:14px 0;margin:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0;max-width:90ch}
.fatal{max-width:72ch}
.fatal code{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* overview */
.ov-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,2fr);gap:12px}
.hero{display:grid;gap:10px;align-content:start}
.hero .fig{font-size:52px;line-height:1;font-weight:600;letter-spacing:-.03em}
.hero .fig small{font-size:20px;font-weight:500;letter-spacing:0;margin-left:6px;color:var(--ink-2)}
.hero p{margin:0;color:var(--ink-2);max-width:56ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--hair);padding:12px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--muted)}
.ov-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.wrap{white-space:normal}
.pool-name b{font-weight:500;display:flex;align-items:center;gap:7px}
.pool-name span{color:var(--muted);font-size:12px}
.meter{position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 16%,var(--surface-2));min-width:110px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.meter.crit{background:color-mix(in srgb,var(--crit) 18%,var(--surface-2))}.meter.crit i{background:var(--crit)}
.meter.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface-2))}.meter.warn i{background:var(--warn)}
.segbar{display:flex;gap:2px;height:28px;margin:6px 0 10px}
.segbar div{border-radius:4px;min-width:0;display:flex;align-items:center;padding-left:6px;font-size:11.5px;font-weight:500;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.bars{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 80px;gap:10px;align-items:center;font-size:13px}
.brow .lab{display:flex;align-items:center;gap:7px;min-width:0}
.brow .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .track{height:14px;position:relative}
.brow .track i{position:absolute;top:0;bottom:0;border-radius:0 4px 4px 0}
.brow .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.div-track{position:relative;height:14px}
.div-track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--axis)}
.div-track i{position:absolute;top:0;bottom:0}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto 64px 74px;gap:10px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--hair)}
.lrow:last-child{border-bottom:0}
.lrow .nm{display:flex;align-items:center;gap:7px;min-width:0}
.lrow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px;white-space:nowrap}

/* heatmap */
.hm-tools{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.hm-scroll{overflow:auto;max-height:min(66vh,760px);border-radius:5px;box-shadow:inset 0 0 0 1px var(--hair);position:relative;overscroll-behavior:contain}
.hm-grid{display:grid;grid-template-rows:30px auto;position:relative;width:max-content;min-width:100%}
.ps,.psb{display:none}
.hm-corner{grid-column:1/-1;grid-row:1;width:var(--lw,250px);justify-self:start;position:sticky;top:0;left:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);display:grid;grid-template-columns:1fr 70px 78px;align-items:center;padding:0 8px 0 10px;font-size:11.5px;color:var(--muted);gap:6px}
.hm-corner span:not(:first-child){text-align:right}
#hm-axis{grid-column:2;grid-row:1;position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--hair);display:block}
/* the labels span both grid columns so they can stay stuck at the left while the cells scroll under them */
#hm-rows{grid-column:1/-1;grid-row:2;width:var(--lw,250px);justify-self:start;position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--hair)}
#hm-cv{display:block;grid-column:2;grid-row:2}
.hm-row{display:grid;grid-template-columns:1fr 70px 78px;gap:6px;align-items:center;height:22px;padding:0 8px 0 10px;border:0;background:none;width:100%;text-align:left;font-size:12.5px;color:var(--ink)}
.hm-row:hover,.hm-row.hov{background:var(--surface-2)}
.hm-row.sel{background:var(--accent-wash)}
.hm-row .nm{display:flex;align-items:center;gap:6px;min-width:0}
.hm-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-row .nm small{color:var(--muted);font-size:10.5px;white-space:nowrap;font-family:var(--font-ui);flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hm-row .car{width:12px;flex:none;color:var(--muted);font-size:10px;text-align:center;transition:transform .12s}
.hm-row.open .car{transform:rotate(90deg)}
.hm-row .sz,.hm-row .dl{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.hm-row.host .nm span{font-weight:600}
.hm-row .nohist{font-size:10.5px;color:var(--muted);font-family:var(--font-ui)}
.scale{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.scale .sw{display:flex;gap:1px}
.scale .sw i{width:20px;height:10px;display:block}
.scale .sw i:first-child{border-radius:3px 0 0 3px}.scale .sw i:last-child{border-radius:0 3px 3px 0}
.drawer{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.drawer .panel{padding:12px 14px}
.dr-title{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.dr-title .p{font-family:var(--font-mono);font-size:13px;word-break:break-all}
.dr-title .m{color:var(--muted);font-size:12px}
.mini{display:grid;gap:0;margin-top:6px}
.mini div{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--hair)}
.mini div:last-child{border-bottom:0}
.mini .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.mini .pa{font-family:var(--font-mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .dv{font-family:var(--font-mono);font-size:11.5px}

/* charts */
svg text{fill:var(--muted);font:11px var(--font-ui)}
svg .grid{stroke:var(--hair);stroke-width:1}
svg .base{stroke:var(--axis);stroke-width:1}
svg .xh{stroke:var(--axis);stroke-width:1}
svg .lbl{fill:var(--ink-2);font-size:11.5px}

/* block map */
.bm-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.bm-main{display:grid;gap:8px;min-width:0;grid-template-columns:minmax(0,1fr)}
.bm-nav{display:flex;gap:8px;align-items:center;min-width:0}
.bm-nav .btn{flex:none}.bm-nav .btn:disabled{opacity:.45;cursor:default}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:13px;min-height:28px;min-width:0;flex:1}
.crumbs button{border:0;background:none;padding:3px 6px;border-radius:4px;color:var(--accent-ink)}
.crumbs button:hover{background:var(--surface-2)}
.crumbs b{padding:3px 6px;font-weight:600}
.crumbs .sep{color:var(--muted)}
.crumbs .ld{color:var(--muted);font-size:12px;margin-left:8px}
#bm-cv{width:100%;height:min(70vh,760px);min-height:420px;display:block;border-radius:5px;background:var(--surface);touch-action:manipulation;cursor:zoom-in}
.bm-ctl{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.feed{display:grid;align-content:start;gap:0;max-height:min(70vh,760px);overflow:auto}
.feed .ev{display:grid;grid-template-columns:58px 8px minmax(0,1fr) auto auto;gap:7px;align-items:center;font-size:12px;padding:4px 2px;border-bottom:1px solid var(--hair);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.feed .ev:hover{background:var(--surface-2)}
.feed .ev.old{opacity:.6}
.feed .ev .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.feed .ev .pa{font-family:var(--font-mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .ev .dv{font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right}
.feed .ev.fresh{animation:fresh 1.2s ease-out}
.src{font-size:10px;font-weight:600;letter-spacing:.03em;padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--hair)}
.src.scan{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink);box-shadow:none}
.src.btrfs{background:color-mix(in srgb,var(--s7) 16%,transparent);color:var(--s7);box-shadow:none}
.src.lvm{background:color-mix(in srgb,var(--act) 16%,transparent);color:var(--act-ink);box-shadow:none}
@keyframes fresh{from{background:var(--accent-wash)}to{background:transparent}}
.side-note{font-size:12px;color:var(--muted);margin:0 0 8px}
.conn{display:grid;gap:4px;margin-bottom:8px;font-size:12px}
.conn div{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.conn div b{font-weight:500;color:var(--ink)}
.conn div span:last-child{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

/* block map: lenses, stories, reclaim, time machine, wall mode */
#bm-lens{flex-wrap:wrap}
.bm-main{align-content:start}
.bm-side{display:grid;align-content:start;gap:8px;align-self:start;max-height:min(90vh,1000px);overflow:auto}

.list2{display:grid}
.lrow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:6px 4px;border:0;border-bottom:1px solid var(--hair);background:none;text-align:left;width:100%;color:var(--ink);align-items:baseline}
.lrow2:hover{background:var(--surface-2)}
.lrow2 .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow2 .v{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.lrow2.pos .v{color:var(--crit-ink)}.lrow2.neg .v{color:var(--accent-ink)}.lrow2.full .v{color:var(--crit-ink);font-weight:600}.lrow2.link .v{color:var(--share)}
.lrow2 .sub{grid-column:1/3;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;padding:9px 8px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair);align-items:start}

      const tr=el('tr',null,el('td',null,el('span',{class:'mono',style:'font-size:12.5px',text:tgName(T.name)})),el('td',{class:'mono',style:'font-size:12px;color:var(--ink-2)',text:fs?maskPath(fs.mount):String(T.fs)}),
        el('td',{text:(T.kind==='lvm_thin'?'thin pool · ':'')+liveText(T)}),el('td',{class:'r num',text:fmtAgo(T.last_scan)}),el('td',{class:'r num hs',text:fmtSpan(T.scan_duration_s)}),el('td',{class:'r num hs',text:fmtEvery(T.interval_s)}),
        el('td',{class:'hs',text:T.sharing?fmtAgo(T.sharing.at):'–'}),el('td',null,tree),el('td',{class:'wrap err',style:'font-size:12px',text:maskText(T.last_error?T.last_error:(ts&&ts.status==='error'?ts.err:''))}));
      hoverTip(tr,[{v:maskPath(T.path),c:'h'},{l:`${fs?fs.type:'?'} · ${maskPath(T.fs_path||'/')} inside the filesystem`,c:'m'},T.scan_running?{l:'scanning now',c:'m'}:null]);tb.append(tr);}
    p.append(el('div',{class:'tbl-wrap',style:'margin-top:10px'},el('table',null,el('thead',null,el('tr',null,...['Target','On','Live','Last scan','Took','Every','Sharing pass','Tree','Error'].map((h,i)=>el('th',{class:([3,4,5].includes(i)?'r ':'')+([4,5,6].includes(i)?'hs':''),text:h})))),tb)));
    const caps=I.filesystems.map(fs=>({fs,c:CAP.get(H.key+'|'+fs.id)}));
    p.append(el('dl',{class:'kv',style:'margin-top:10px'},...caps.flatMap(({fs,c})=>[el('dt',{text:'Capacity '+maskPath(fs.mount)}),el('dd',{text:!METRICS?'no history store':!c?'loading':c.status==='ok'?`${c.src}, since ${fmtSince(c.start)}`:c.status==='empty'?`${c.src}: no samples yet`:`${c.src}: ${maskText(c.err)}`})])));
  }
}

/* ======================================================================= shell */
const VIEWS={overview:renderOverview,changes:renderChanges,blockmap:renderBlockmap,sharing:renderSharing,sources:renderSources};
function current(){const h=location.hash.slice(1);return VIEWS[h]?h:'overview';}
function show(){const cur=current();for(const k in VIEWS)$('#v-'+k).hidden=k!==cur;for(const a of document.querySelectorAll('.tabs a')){a.setAttribute('aria-current',a.dataset.view===cur?'page':'false');if(a.dataset.view===cur){const t=a.parentNode;if(a.offsetLeft+a.offsetWidth>t.scrollLeft+t.clientWidth)t.scrollLeft=a.offsetLeft+a.offsetWidth-t.clientWidth+12;else if(a.offsetLeft<t.scrollLeft)t.scrollLeft=a.offsetLeft-12;}}untip();BM.on=cur==='blockmap';if(!BM.on){BM.pulses.length=0;if(BM.wall)setWall(false);}VIEWS[cur]();}
const hideBox=$('#hide-names');
HIDE=QS.get('hide')==='1'||(QS.get('hide')==null&&store.get('hide')==='1');hideBox.checked=HIDE;
hideBox.addEventListener('change',e=>{HIDE=e.target.checked;store.set('hide',HIDE?'1':null);renderHeader();BM.needBase=true;show();});
addEventListener('hashchange',show);
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const cur=current();if(cur==='changes'){hmLayout();hmDraw();hmDrawer();}else if(cur==='blockmap'){BM.needLayout=true;bmSchedule();if(BM.mode==='time')drawTimeChart();}else VIEWS[cur]();},150);});
const THEMES=['auto','light','dark'];let THEME=QS.get('theme')||store.get('theme')||'auto';if(!THEMES.includes(THEME))THEME='auto';
// theme-color follows the forced theme too (the browser chrome and an installed app's title bar)
const TCOL={light:'#fcfcfd',dark:'#14171b'};
function applyTheme(){if(THEME==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',THEME);$('#theme-btn').textContent='Theme: '+THEME;
  for(const m of document.querySelectorAll('meta[name="theme-color"]')){if(m.dataset.media==null)m.dataset.media=m.media;const dark=/dark/.test(m.dataset.media);m.media=THEME==='auto'?m.dataset.media:'all';m.content=TCOL[THEME==='auto'?(dark?'dark':'light'):THEME];}}
// installed (home screen / app window): the phone layout puts the views in a bottom tab bar. ?standalone=1 simulates it.
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||QS.get('standalone')==='1')document.documentElement.classList.add('standalone');
$('#theme-btn').addEventListener('click',()=>{THEME=THEMES[(THEMES.indexOf(THEME)+1)%3];store.set('theme',THEME==='auto'?null:THEME);applyTheme();});
function retheme(){readColors();BM.base=null;BM.needBase=true;show();}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
applyTheme();readColors();

async function boot(){
  const s=selfUrl();SELF_HOW=s.how;
  if(!s.url){FATAL=()=>el('div',{class:'panel fatal'},el('h2',{text:'No harvester to talk to'}),el('p',{class:'explain',style:'margin-top:6px'},'Open this page from a storage-harvester at ',el('code',{text:'/atlas'}),', or pass ',el('code',{text:'?self=http://host:port'}),' (and optionally ',el('code',{text:'?peers=url1,url2'}),' and ',el('code',{text:'?metrics=url'}),').'));renderHeader();show();return;}
  const self=addHarvester(s.url,true);renderHeader();show();
  await loadInfo(self);
  // API-v2 §1: a harvester with atlas.proxy relays its peers and VictoriaMetrics on its own origin, so the page works
  // over HTTPS behind a reverse proxy (no mixed content, one SSO cookie). ?peers= and ?metrics= still go direct.
  const ai=(self.info&&self.info.atlas)||{},relay=ai.proxy===true,qp=QS.get('peers'),qm=QS.get('metrics');
  const peers=qp!=null?qp.split(',').map(x=>x.trim()).filter(Boolean):(Array.isArray(ai.peers)?ai.peers:[]);
  PEERS_HOW=qp!=null?'?peers=':self.info?(relay?'atlas.peers, relayed by '+hostName(self):'atlas.peers'):'none (this harvester is offline)';
  METRICS=qm!=null?(qm||null):ai.metrics_url||null;
  if(METRICS&&!/^https?:\/\//.test(METRICS))METRICS=normUrl(METRICS);
  METRICS_SHOWN=METRICS;METRICS_HOW=qm!=null?'?metrics=':'atlas.metrics_url';
  if(qm==null&&relay&&METRICS){METRICS=self.url+'/api/metrics';METRICS_HOW='atlas.metrics_url, relayed by '+hostName(self);}
  const ps=peers.map((p,i)=>qp==null&&relay?addHarvester(self.url+'/api/peer/'+i,false,{shown:normUrl(p)||String(p),relay:self}):addHarvester(p,false)).filter(Boolean);
  renderHeader();
  await Promise.all(ps.map(loadInfo));
  HARV.filter(h=>h.key).sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0).forEach((h,i)=>{h.slot=i;});let nx=HARV.filter(h=>h.key).length;for(const h of HARV)if(!h.key)h.slot=nx++;
  BOOTED=true;
  for(const H of HARV)if(H.status==='ok'){loadTrees(H);connect(H);}
  loadHistory();loadCapacity();
  invalidate('info');show();
  setInterval(()=>{for(const H of HARV)if(H.status!=='duplicate')loadInfo(H);},30000);
  setInterval(()=>{if(METRICS&&document.visibilityState!=='hidden'&&(!HIST.fetchedAt||Date.now()/1000-HIST.fetchedAt>Math.max(60,Math.min(600,HIST.step||60))))loadHistory();},20000);
  setInterval(()=>{if(METRICS)loadCapacity();},600000);
  setInterval(()=>{if(current()==='overview')renderOvLive();if(current()==='blockmap'){renderConn();renderStories();}
    const now=Date.now();if(HEAT.size>5000)for(const [k,a] of HEAT)if(a.v*Math.exp(-(now-a.t)/HEAT_TAU)<1)HEAT.delete(k);for(const [k,e] of IOD)if(now-e.at>120000)IOD.delete(k);},5000);
}
boot();
